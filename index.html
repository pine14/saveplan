<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF5A1F">
<meta name="description" content="기간과 목표 금액을 정해두고 달마다 얼마를 모았는지 채워나가는 저축 플래너.">
<title>세이브플랜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23FF5A1F'/><circle cx='50' cy='50' r='26' fill='none' stroke='%23100C08' stroke-width='13' stroke-dasharray='110 164' transform='rotate(-90 50 50)'/></svg>">

<style>
:root{
  --bg:#FFFFFF;
  --panel:#F4F3F0;
  --panel-2:#EDEBE6;
  --ink:#101010;
  --ink-2:#6E6C66;
  --ink-3:#9B9890;
  --track:#E4E2DC;
  --accent:#FF5A1F;
  --accent-text:#D13F05;
  --on-accent:#100C08;
  --radius:22px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C0C0B; --panel:#171613; --panel-2:#201E1A;
    --ink:#F7F6F2; --ink-2:#92908A; --ink-3:#6A6862;
    --track:#2A2925; --accent:#FF6B33; --accent-text:#FF8552; --on-accent:#100C08;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0C0B; --panel:#171613; --panel-2:#201E1A;
  --ink:#F7F6F2; --ink-2:#92908A; --ink-3:#6A6862;
  --track:#2A2925; --accent:#FF6B33; --accent-text:#FF8552; --on-accent:#100C08;
}

*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Gothic A1","Apple SD Gothic Neo",system-ui,sans-serif;
  font-size:16px;
  line-height:1.55;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
.wrap{width:100%;max-width:1060px;margin:0 auto;padding-inline:clamp(20px,5vw,44px);}
.mono{
  font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;
  font-weight:500;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
}
/* the invisible span that measures what width an auto-sizing input needs */
.mirror{position:absolute;visibility:hidden;pointer-events:none;white-space:pre;font:inherit;letter-spacing:inherit;}

/* ─────────── plan switcher ─────────── */
.s-plans{padding-top:clamp(18px,4vw,28px);}
.plans{
  display:flex;gap:8px;align-items:center;
  overflow-x:auto;scrollbar-width:none;
  padding-bottom:4px;
  -webkit-overflow-scrolling:touch;
}
.plans::-webkit-scrollbar{display:none;}
.pill{
  display:inline-flex;align-items:stretch;flex:none;
  border:2px solid var(--track);border-radius:999px;
  background:transparent;overflow:hidden;
  transition:border-color .15s ease,background .15s ease;
}
.pill:hover{border-color:var(--ink-3);}
.pill.on{background:var(--ink);border-color:var(--ink);}
.pill button{
  font:inherit;font-weight:700;font-size:14px;
  white-space:nowrap;background:transparent;border:0;
  color:var(--ink-2);cursor:pointer;
  transition:color .15s ease,opacity .15s ease;
}
.pill button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px;border-radius:999px;}
.pill:hover .pill-main{color:var(--ink);}
.pill.on .pill-main,.pill.on:hover .pill-main{color:var(--bg);}
.pill-main{padding:9px 16px;}
.pill.on .pill-main{padding-right:7px;}
.pill .dot{
  display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--accent);margin-right:7px;transform:translateY(-1px);
}
/* 삭제는 현재 보고 있는 플랜에만 나온다 — 잘못 눌러 다른 플랜을 지우는 일이 없도록 */
.pill-del{
  padding:9px 14px 9px 5px;font-size:17px;line-height:1.1;
  color:var(--bg);opacity:.55;
}
.pill-del:hover{opacity:1;color:#FF7A55;}
.pill-add{
  padding:9px 15px;font-size:17px;line-height:1.1;color:var(--ink-3);
  border:2px solid var(--track);border-radius:999px;background:transparent;
  font-weight:700;cursor:pointer;flex:none;
  transition:border-color .15s ease,color .15s ease;
}
.pill-add:hover{border-color:var(--ink-3);color:var(--ink);}
.pill-add:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

/* ─────────── headline ─────────── */
.s-head{padding:clamp(20px,5vw,44px) 0 clamp(26px,6vw,48px);}
.period{
  display:inline-flex;align-items:center;gap:9px;
  background:transparent;border:0;padding:0;margin:0 0 clamp(14px,3vw,22px);
  color:var(--ink-3);cursor:pointer;font:inherit;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-weight:500;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  border-bottom:1px solid transparent;
}
.period:hover{color:var(--ink);border-bottom-color:var(--track);}
.period:focus-visible{outline:3px solid var(--accent);outline-offset:4px;}
.period svg{width:13px;height:13px;flex:none;}

h1{
  margin:0;font-weight:900;
  font-size:clamp(52px,15.5vw,124px);
  line-height:.88;letter-spacing:-.045em;
  display:flex;flex-direction:column;
}
h1 .line{display:flex;align-items:baseline;}
.h-input{
  font:inherit;letter-spacing:inherit;
  font-variant-numeric:tabular-nums;
  background:transparent;border:0;padding:0;margin:0;
  width:4ch;text-align:left;
  border-bottom:.06em solid transparent;border-radius:2px;
  -moz-appearance:textfield;cursor:text;color:var(--ink);
}
.h-input::-webkit-outer-spin-button,.h-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.h-input:hover{border-bottom-color:var(--track);}
.h-input:focus{outline:none;border-bottom-color:var(--accent);}
#goalInput{color:var(--accent);}

.lede{margin:clamp(20px,4vw,30px) 0 0;max-width:34ch;font-size:clamp(16px,2.2vw,19px);color:var(--ink-2);line-height:1.5;}
.lede b{color:var(--ink);font-weight:700;}

/* ─────────── dial ─────────── */
.s-dial{padding-bottom:clamp(28px,6vw,60px);}
.dial-grid{display:flex;flex-direction:column;align-items:center;gap:clamp(22px,4vw,40px);}
.dial-wrap{position:relative;width:min(74vw,340px);aspect-ratio:1;flex:none;}
.dial{width:100%;height:100%;display:block;transform:rotate(-90deg);overflow:visible;}
.dial .track-ring{fill:none;stroke:var(--track);}
.dial .fill-ring{fill:none;stroke:var(--accent);stroke-linecap:round;transition:stroke-dasharray 1s cubic-bezier(.2,.85,.25,1);}
.dial .fill-ring[data-zero="1"]{visibility:hidden;}
.dial .divider{stroke:var(--bg);stroke-width:5;}
.dial-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 16%;}
.dial-mid .mono{color:var(--ink-3);}
.d-amt{font-weight:900;font-size:clamp(40px,11vw,62px);line-height:1;letter-spacing:-.045em;margin:.18em 0 .1em;}
.d-amt .u{font-size:.44em;letter-spacing:-.02em;margin-left:.06em;}
.d-pct{font-size:clamp(14px,3.4vw,17px);font-weight:700;color:var(--accent-text);}
.d-pct.done{color:var(--ink);}

/* ─────────── band ─────────── */
.s-band{background:var(--accent);color:var(--on-accent);transition:background .35s ease;}
.s-band.done{background:var(--ink);color:var(--bg);}
.band{display:flex;flex-direction:column;padding-block:clamp(28px,6vw,48px);}
.bstat{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-block:clamp(13px,2.6vw,17px);border-bottom:1.5px solid currentColor;}
.bstat:first-child{border-top:1.5px solid currentColor;}
.bstat > span{font-size:14px;font-weight:700;letter-spacing:-.01em;opacity:.72;}
.bstat > b{font-weight:900;font-size:clamp(26px,7.4vw,42px);letter-spacing:-.04em;line-height:1.1;text-align:right;}

/* ─────────── months ─────────── */
.s-months{padding:clamp(40px,8vw,80px) 0 clamp(28px,5vw,40px);}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:clamp(20px,4vw,28px);}
h2{margin:0;font-weight:900;font-size:clamp(26px,6vw,40px);letter-spacing:-.04em;line-height:1;}
.sec-title p{margin:0;font-size:13.5px;color:var(--ink-3);font-weight:500;}
.months{display:grid;grid-template-columns:1fr;gap:12px;}
.mb{background:var(--panel);border-radius:var(--radius);padding:clamp(18px,4vw,22px);display:flex;flex-direction:column;gap:15px;transition:background .2s ease;}
.mb:focus-within{background:var(--panel-2);}
.mb-top{display:flex;align-items:center;justify-content:space-between;gap:14px;}
.mb-name{font-weight:900;font-size:clamp(20px,4.6vw,25px);letter-spacing:-.035em;display:flex;align-items:center;gap:9px;}
.mb-name .yr{font-size:.6em;font-weight:700;color:var(--ink-3);letter-spacing:-.02em;}
.tag{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:500;font-size:10px;letter-spacing:.1em;
  padding:4px 9px;border-radius:999px;background:var(--ink);color:var(--bg);white-space:nowrap;transform:translateY(-1px);
}
.mb-field{display:flex;align-items:baseline;gap:5px;}
.mb-field input{
  font:inherit;font-weight:900;font-size:clamp(26px,6.4vw,34px);letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;color:var(--ink);background:transparent;
  border:0;border-bottom:2.5px solid var(--track);padding:2px 0;width:4.6ch;text-align:right;
  border-radius:1px;-moz-appearance:textfield;transition:border-color .18s ease,color .18s ease;
}
.mb-field input::-webkit-outer-spin-button,.mb-field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.mb-field input::placeholder{color:var(--ink-3);font-weight:700;}
.mb-field input:hover{border-bottom-color:var(--ink-3);}
.mb-field input:focus{outline:none;border-bottom-color:var(--accent);color:var(--accent-text);}
.mb-field .u{font-size:15px;font-weight:700;color:var(--ink-2);}
.mb-bar{height:10px;border-radius:999px;background:var(--track);overflow:hidden;}
.mb-bar i{display:block;height:100%;width:0;border-radius:999px;background:var(--accent);transition:width .75s cubic-bezier(.2,.85,.25,1);}
.mb-foot{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:13px;font-weight:500;color:var(--ink-2);}
.mb-foot b{color:var(--ink);font-weight:700;}
.mb.is-empty .mb-foot{color:var(--ink-3);}

/* ─────────── footer ─────────── */
.s-foot{padding:clamp(24px,5vw,40px) 0 clamp(48px,10vw,80px);}
.foot{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:clamp(22px,4vw,30px);border-top:2px solid var(--track);}
.foot p{margin:0;font-size:13px;color:var(--ink-3);font-weight:500;max-width:46ch;}
.btn{
  font:inherit;font-weight:700;font-size:14px;color:var(--ink);background:transparent;
  border:2px solid var(--ink);border-radius:999px;padding:11px 22px;cursor:pointer;white-space:nowrap;
  transition:background .18s ease,color .18s ease,border-color .18s ease;
}
.btn:hover{background:var(--ink);color:var(--bg);}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
.btn.quiet{border-color:var(--track);color:var(--ink-2);}
.btn.quiet:hover{border-color:var(--ink);background:transparent;color:var(--ink);}
.btn.danger{border-color:var(--track);color:var(--ink-3);}
.btn.danger:hover{border-color:#C62F12;background:#C62F12;color:#fff;}

/* ─────────── settings sheet ─────────── */
.scrim{
  position:fixed;inset:0;background:rgba(16,16,16,.5);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:50;
}
.scrim[data-open="1"]{opacity:1;pointer-events:auto;}
.sheet{
  background:var(--bg);color:var(--ink);
  width:100%;max-width:520px;
  border-radius:26px 26px 0 0;
  padding:clamp(22px,5vw,30px) clamp(20px,5vw,30px) calc(clamp(22px,5vw,30px) + env(safe-area-inset-bottom));
  transform:translateY(16px);transition:transform .22s cubic-bezier(.2,.85,.25,1);
  max-height:90vh;overflow-y:auto;
}
.scrim[data-open="1"] .sheet{transform:translateY(0);}
@media (min-width:560px){
  .scrim{align-items:center;}
  .sheet{border-radius:26px;}
}
.sheet:focus{outline:none;}
.sheet h3{margin:0 0 20px;font-weight:900;font-size:26px;letter-spacing:-.035em;}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-top:1.5px solid var(--track);}
.setrow label{font-size:14px;font-weight:700;color:var(--ink-2);}
.setrow .ctl{display:flex;align-items:baseline;gap:6px;}
.setrow select,.setrow input{
  font:inherit;font-weight:900;font-size:20px;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;color:var(--ink);
  background:var(--panel);border:2px solid transparent;border-radius:10px;
  padding:7px 10px;-moz-appearance:textfield;
}
.setrow input{box-sizing:content-box;width:2.6ch;text-align:right;}
.setrow select{padding-right:6px;}
.setrow input::-webkit-outer-spin-button,.setrow input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.setrow select:focus,.setrow input:focus{outline:none;border-color:var(--accent);}
.setrow .u{font-size:14px;font-weight:700;color:var(--ink-2);}
.sheet-note{margin:16px 0 0;font-size:13px;color:var(--ink-3);font-weight:500;line-height:1.5;}
.sheet-actions{display:flex;gap:10px;justify-content:space-between;margin-top:24px;}

@media (min-width:680px){
  .months{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));}
  .band{flex-direction:row;gap:0;}
  .bstat{flex:1;flex-direction:column;align-items:flex-start;gap:6px;border-bottom:0;border-top:1.5px solid currentColor;padding:18px 24px 4px 0;}
  .bstat:first-child{border-top:1.5px solid currentColor;}
  .bstat > b{text-align:left;}
}
.dial-side{display:none;}
@media (min-width:940px){
  .dial-grid{flex-direction:row;align-items:center;justify-content:space-between;gap:clamp(40px,6vw,80px);}
  .dial-wrap{width:min(38vw,400px);}
  .dial-side{display:block;flex:1;max-width:400px;}
  .dial-side h2{margin-bottom:14px;}
  .dial-side p{margin:0;font-size:17px;color:var(--ink-2);line-height:1.55;}
  .dial-side p b{color:var(--ink);font-weight:700;}
  .s-head .lede{display:none;}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important;animation-duration:.01ms !important;}}
</style>
</head>
<body>

<section class="s-plans">
  <div class="wrap">
    <div class="plans" id="plans" role="tablist" aria-label="플랜 목록"></div>
  </div>
</section>

<section class="s-head">
  <div class="wrap">
    <button class="period" id="periodBtn" type="button" aria-haspopup="dialog">
      <span id="periodText">2026.09 → 2026.12 · 4개월</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3.4"/></svg>
    </button>
    <h1>
      <span class="line"><input class="h-input num" id="goalInput" type="text" inputmode="decimal" value="1,000" aria-label="목표 금액 (만원)"><span class="mirror num" id="goalMirror" aria-hidden="true"></span>만원</span>
      <span class="line"><input class="h-input" id="nameInput" type="text" maxlength="14" value="프로젝트" aria-label="플랜 이름"><span class="mirror" id="nameMirror" aria-hidden="true"></span></span>
    </h1>
    <p class="lede">달마다 실제로 넣은 돈을 적으면 <b>얼마나 채웠는지</b>와 <b>남은 달에 매달 얼마씩</b> 넣어야 하는지 다시 계산합니다.</p>
  </div>
</section>

<section class="s-dial">
  <div class="wrap dial-grid">
    <div class="dial-wrap">
      <svg class="dial" viewBox="0 0 200 200" role="img" aria-labelledby="dialT">
        <title id="dialT">저축 진행률 게이지</title>
        <circle class="track-ring" cx="100" cy="100" r="80" stroke-width="26"></circle>
        <circle class="fill-ring" id="fillRing" cx="100" cy="100" r="80" stroke-width="26" stroke-dasharray="0 502.65"></circle>
        <g id="dividers"></g>
      </svg>
      <div class="dial-mid">
        <span class="mono">모은 돈</span>
        <div class="d-amt num" id="dAmt">0<span class="u">만원</span></div>
        <div class="d-pct num" id="dPct">목표의 0%</div>
      </div>
    </div>
    <div class="dial-side">
      <h2 id="sideTitle">아직 시작 전</h2>
      <p id="sideText"></p>
    </div>
  </div>
</section>

<section class="s-band" id="band">
  <div class="wrap band">
    <div class="bstat"><span>남은 금액</span><b class="num" id="bRest">1,000만원</b></div>
    <div class="bstat"><span>매달 넣어야 할 돈</span><b class="num" id="bPer">250만원</b></div>
    <div class="bstat"><span>남은 달</span><b class="num" id="bLeft">4개월</b></div>
  </div>
</section>

<section class="s-months">
  <div class="wrap">
    <div class="sec-title">
      <h2>달마다 얼마 넣었나</h2>
      <p>만원 단위 · 이 브라우저에 자동 저장</p>
    </div>
    <div class="months" id="months"></div>
  </div>
</section>

<section class="s-foot">
  <div class="wrap foot">
    <p>막대는 기간에 고르게 나눴을 때의 기준 금액(<span class="num" id="footPace">250만원</span>) 대비 그 달의 성적입니다.</p>
    <button class="btn quiet" id="resetBtn" type="button">입력 지우기</button>
  </div>
</section>

<div class="scrim" id="scrim" data-open="0">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
    <h3 id="sheetTitle">플랜 설정</h3>
    <div class="setrow">
      <label for="setYear">시작</label>
      <div class="ctl">
        <input id="setYear" type="number" min="2000" max="2100" step="1" style="width:4.4ch" aria-label="시작 연도">
        <span class="u">년</span>
        <select id="setMonth" aria-label="시작 월"></select>
        <span class="u">월</span>
      </div>
    </div>
    <div class="setrow">
      <label for="setLen">기간</label>
      <div class="ctl">
        <input id="setLen" type="number" min="1" max="24" step="1" aria-label="개월 수">
        <span class="u">개월</span>
      </div>
    </div>
    <p class="sheet-note">기간을 줄여도 각 달에 적어둔 금액은 그 달에 그대로 붙어 있습니다. 다시 늘리면 값이 되살아납니다.</p>
    <div class="sheet-actions">
      <button class="btn danger" id="delPlanBtn" type="button">이 플랜 삭제</button>
      <button class="btn" id="closeSheetBtn" type="button">완료</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var KEY = "saveplan-v2";
  var LEGACY_V1 = "saveplan-v1";
  var LEGACY_V0 = "cheonman-v2";
  var MAN = 10000;
  var R = 80, C = 2 * Math.PI * R;
  var MAXLEN = 24;

  /* ── data model ───────────────────────────────────────────
     vault = { v, activeId, plans:[ {id,name,goal,y,m,n,saved:{"2026-09":1500000}} ] }
     금액은 달력상의 달(YYYY-MM)에 묶여 있어서, 기간을 바꿔도 값이 엉키지 않는다. */

  function uid(){ return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function ym(y, m){ return y + "-" + (m < 10 ? "0" + m : m); }

  function newPlan(name){
    var now = new Date();
    return { id:uid(), name:name || "프로젝트", goal:1000*MAN,
             y:now.getFullYear(), m:now.getMonth()+1, n:4, saved:{} };
  }

  var vault = null;
  try{
    var raw = localStorage.getItem(KEY);
    if (raw) vault = JSON.parse(raw);
    if (!vault){
      /* 예전 버전으로 저장된 값이 있으면 플랜 하나로 옮겨온다 */
      var old = localStorage.getItem(LEGACY_V1) || localStorage.getItem(LEGACY_V0);
      if (old){
        var o = JSON.parse(old);
        var p = newPlan("프로젝트");
        p.y = 2026; p.m = 9; p.n = 4;
        if (typeof o.goal === "number" && o.goal > 0) p.goal = o.goal;
        if (o.saved) [9,10,11,12].forEach(function(mm){
          var v = o.saved[mm];
          if (typeof v === "number" && isFinite(v) && v > 0) p.saved[ym(2026, mm)] = v;
        });
        vault = { v:2, activeId:p.id, plans:[p] };
        localStorage.setItem(KEY, JSON.stringify(vault));
        localStorage.removeItem(LEGACY_V1); localStorage.removeItem(LEGACY_V0);
      }
    }
  }catch(e){ vault = null; }

  if (!vault || !vault.plans || !vault.plans.length){
    var first = newPlan("프로젝트");
    vault = { v:2, activeId:first.id, plans:[first] };
  }

  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(vault)); }catch(e){} }

  function plan(){
    var p = vault.plans.filter(function(x){ return x.id === vault.activeId; })[0];
    if (!p){ p = vault.plans[0]; vault.activeId = p.id; }
    /* 저장값이 손상돼 있어도 화면이 깨지지 않도록 값을 정리한다 */
    p.n = Math.max(1, Math.min(MAXLEN, Math.round(p.n) || 1));
    p.m = Math.max(1, Math.min(12, Math.round(p.m) || 1));
    p.y = Math.max(2000, Math.min(2100, Math.round(p.y) || 2026));
    if (!(p.goal > 0)) p.goal = 1000 * MAN;
    if (!p.saved || typeof p.saved !== "object") p.saved = {};
    return p;
  }

  /* ── helpers ─────────────────────────────────────────── */
  function manNum(n){
    var v = n / MAN;
    return (Math.abs(v - Math.round(v)) < 0.005) ? Math.round(v) : Math.round(v*10)/10;
  }
  function man(n){ return manNum(n).toLocaleString("ko-KR",{maximumFractionDigits:1}) + "만원"; }
  function fmt(n){ return manNum(n).toLocaleString("ko-KR",{maximumFractionDigits:1}); }

  function monthsOf(p){
    var out = [], y = p.y, m = p.m;
    for (var i = 0; i < p.n; i++){
      out.push({ key: ym(y, m), y: y, m: m });
      m++; if (m > 12){ m = 1; y++; }
    }
    return out;
  }
  function amountAt(p, key){
    var v = p.saved[key];
    return (typeof v === "number" && isFinite(v) && v >= 0) ? v : null;
  }

  /* ── auto-sizing inputs (mirror measures the real glyph width) ── */
  function sizer(input, mirror){
    return function(){
      mirror.textContent = input.value || " ";
      input.style.width = (mirror.getBoundingClientRect().width + 2) + "px";
    };
  }
  var goalInput  = document.getElementById("goalInput");
  var goalMirror = document.getElementById("goalMirror");
  var nameInput  = document.getElementById("nameInput");
  var nameMirror = document.getElementById("nameMirror");
  var sizeGoal = sizer(goalInput, goalMirror);
  var sizeName = sizer(nameInput, nameMirror);

  /* ── count-up ────────────────────────────────────────── */
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var dAmt = document.getElementById("dAmt");
  var shown = 0, raf = null, settle = null;
  function paint(v, exact){
    var n = exact ? manNum(v) : Math.round(v / MAN);
    dAmt.innerHTML = n.toLocaleString("ko-KR",{maximumFractionDigits:1}) + '<span class="u">만원</span>';
  }
  /* shown은 '마지막으로 그린 값'이다. 밖에서 0으로 바꾸면 화면과 어긋나므로
     리셋은 반드시 이 함수를 거친다. */
  function resetHero(){
    if (raf) cancelAnimationFrame(raf);
    clearTimeout(settle);
    raf = null; shown = 0; paint(0, true);
  }
  function setHero(target){
    if (raf) cancelAnimationFrame(raf);
    clearTimeout(settle);
    if (reduce){ paint(target, true); shown = target; return; }
    /* 백그라운드 탭처럼 rAF가 멈추는 상황에서도 최종 금액은 반드시 찍히게 한다 */
    settle = setTimeout(function(){ paint(target, true); shown = target; raf = null; }, 900);
    var from = shown, t0 = null;
    raf = requestAnimationFrame(function step(ts){
      if (t0 === null) t0 = ts;
      var k = Math.min(1, (ts - t0) / 700);
      var e = 1 - Math.pow(1 - k, 3);
      if (k < 1){ paint(from + (target - from) * e, false); raf = requestAnimationFrame(step); }
      else { paint(target, true); shown = target; raf = null; clearTimeout(settle); }
    });
  }

  /* ── DOM refs ────────────────────────────────────────── */
  var monthsEl  = document.getElementById("months");
  var plansEl   = document.getElementById("plans");
  var divEl     = document.getElementById("dividers");
  var fillRing  = document.getElementById("fillRing");
  var scrim     = document.getElementById("scrim");

  /* ── plan pills ──────────────────────────────────────── */
  function renderPills(){
    plansEl.innerHTML = "";
    vault.plans.forEach(function(p){
      var active = p.id === vault.activeId;
      var wrap = document.createElement("div");
      wrap.className = "pill" + (active ? " on" : "");

      var b = document.createElement("button");
      b.type = "button";
      b.className = "pill-main";
      b.setAttribute("role","tab");
      b.setAttribute("aria-selected", active ? "true" : "false");
      b.innerHTML = (active ? '<span class="dot"></span>' : '') + escapeHtml(p.name);
      b.addEventListener("click", function(){
        if (active) return;
        vault.activeId = p.id; save(); resetHero(); rebuild();
      });
      wrap.appendChild(b);

      if (active){
        var x = document.createElement("button");
        x.type = "button";
        x.className = "pill-del";
        x.setAttribute("aria-label", p.name + " 플랜 삭제");
        x.textContent = "\u00d7";
        x.addEventListener("click", function(){ deletePlan(p.id); });
        wrap.appendChild(x);
      }
      plansEl.appendChild(wrap);
    });

    var add = document.createElement("button");
    add.type = "button";
    add.className = "pill-add";
    add.setAttribute("aria-label","새 플랜 추가");
    add.textContent = "+";
    add.addEventListener("click", addPlan);
    plansEl.appendChild(add);
  }

  function addPlan(){
    var p = newPlan("새 플랜");
    vault.plans.push(p); vault.activeId = p.id; save(); resetHero(); rebuild();
    nameInput.focus(); nameInput.select();
  }

  /* 마지막 플랜도 지울 수 있다. 빈 플랜이 그 자리를 대신하므로
     화면이 빈 상태로 남지 않는다. */
  function deletePlan(id){
    var p = vault.plans.filter(function(x){ return x.id === id; })[0];
    if (!p) return;
    var filled = Object.keys(p.saved || {}).length;
    var msg = '"' + p.name + '" 플랜을 지울까요?';
    if (filled) msg += "\n적어둔 " + filled + "개월치 금액도 함께 사라집니다.";
    if (!confirm(msg)) return;

    vault.plans = vault.plans.filter(function(x){ return x.id !== id; });
    if (!vault.plans.length) vault.plans.push(newPlan("프로젝트"));
    vault.activeId = vault.plans[0].id;
    save(); closeSheet(); resetHero(); rebuild();
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  /* ── month cards + ring dividers are rebuilt when the period changes ── */
  var list = [];
  function buildMonths(){
    var p = plan();
    list = monthsOf(p);
    monthsEl.innerHTML = "";
    list.forEach(function(mo, i){
      var showYear = (i === 0 && p.n > 1 && list[p.n-1].y !== p.y) || (i > 0 && mo.m === 1);
      var el = document.createElement("article");
      el.className = "mb is-empty";
      el.id = "mb-" + mo.key;
      el.innerHTML =
        '<div class="mb-top">' +
          '<span class="mb-name">' + (showYear ? '<span class="yr">' + String(mo.y).slice(2) + '년</span>' : '') +
            mo.m + '월<span class="tag" id="tag-'+mo.key+'" hidden></span></span>' +
          '<span class="mb-field"><input id="in-'+mo.key+'" type="number" min="0" step="10" inputmode="decimal" placeholder="0" aria-label="'+mo.y+'년 '+mo.m+'월에 넣은 돈 (만원)"><span class="u">만원</span></span>' +
        '</div>' +
        '<div class="mb-bar"><i id="bar-'+mo.key+'"></i></div>' +
        '<div class="mb-foot"><span id="f1-'+mo.key+'">아직 입력 전</span><span id="f2-'+mo.key+'"></span></div>';
      monthsEl.appendChild(el);

      var input = el.querySelector("input");
      var v = amountAt(p, mo.key);
      if (v !== null) input.value = manNum(v);
      input.addEventListener("input", function(){
        var s = input.value.trim();
        var num = parseFloat(s);
        var pp = plan();
        if (s === "" || !isFinite(num) || num < 0) delete pp.saved[mo.key];
        else pp.saved[mo.key] = num * MAN;
        save(); render(true);
      });
    });

    /* 달이 너무 많으면 구분선이 링을 뒤덮어 오히려 읽기 어려워진다 */
    divEl.innerHTML = "";
    if (p.n <= 12){
      for (var i = 0; i < p.n - 1; i++){
        var l = document.createElementNS("http://www.w3.org/2000/svg","line");
        l.setAttribute("class","divider");
        l.setAttribute("x1", String(100 + R - 13)); l.setAttribute("y1","100");
        l.setAttribute("x2", String(100 + R + 13)); l.setAttribute("y2","100");
        l.setAttribute("opacity","0");
        divEl.appendChild(l);
      }
    }
  }

  /* ── render ──────────────────────────────────────────── */
  function render(animate){
    var p = plan();
    var goal = p.goal, pace = goal / p.n;

    var total = 0, planned = 0;
    list.forEach(function(mo){
      var v = amountAt(p, mo.key);
      if (v !== null){ total += v; planned++; }
    });
    var rest = Math.max(0, goal - total);
    var ratio = goal > 0 ? Math.min(1, total / goal) : 0;
    var left = p.n - planned;
    var done = total >= goal && goal > 0;

    var len = ratio * C;
    fillRing.setAttribute("stroke-dasharray", (animate ? len : 0) + " " + C);
    fillRing.setAttribute("data-zero", len > 0.5 ? "0" : "1");

    var divs = divEl.childNodes, cum = 0;
    for (var i = 0; i < divs.length; i++){
      cum += (amountAt(p, list[i].key) || 0);
      var f = goal > 0 ? cum / goal : 0;
      if (animate && f > 0.012 && f < ratio - 0.012){
        divs[i].setAttribute("transform", "rotate(" + (f * 360) + " 100 100)");
        divs[i].setAttribute("opacity","1");
      } else divs[i].setAttribute("opacity","0");
    }

    setHero(total);
    var dPct = document.getElementById("dPct");
    if (done){ dPct.textContent = "목표 달성 · " + Math.round(total/goal*100) + "%"; dPct.classList.add("done"); }
    else { dPct.textContent = "목표의 " + (Math.round(ratio*1000)/10) + "%"; dPct.classList.remove("done"); }

    var band = document.getElementById("band");
    band.classList.toggle("done", done);
    document.getElementById("bRest").textContent = done ? "0원" : man(rest);
    document.getElementById("bLeft").textContent = left > 0 ? left + "개월" : "없음";
    var bPer = document.getElementById("bPer");
    bPer.textContent = done ? "다 넣었음" : (left === 0 ? man(rest) + " 부족" : man(rest / left));

    var st = document.getElementById("sideTitle"), sx = document.getElementById("sideText");
    if (done){
      var over = total - goal;
      st.textContent = "다 모았습니다";
      sx.innerHTML = over > 0
        ? "합계 <b>" + man(total) + "</b>. 목표를 <b>" + man(over) + "</b> 넘겼습니다."
        : "합계 <b>" + man(total) + "</b>. 목표를 정확히 채웠습니다.";
    } else if (planned === 0){
      st.textContent = "아직 시작 전";
      sx.innerHTML = "목표대로라면 <b>매달 " + man(pace) + "</b>씩 넣으면 됩니다.";
    } else if (left === 0){
      st.textContent = man(rest) + " 모자람";
      sx.innerHTML = "기간을 다 썼는데 <b>" + man(rest) + "</b>이 비었습니다. 목표나 기간을 조정해 보세요.";
    } else {
      st.textContent = "남은 " + left + "개월";
      sx.innerHTML = "<b>매달 " + man(rest/left) + "</b>씩 넣으면 목표에 닿습니다. 지금까지 " + man(total) + " 모았습니다.";
    }

    var run = 0;
    list.forEach(function(mo){
      var v = amountAt(p, mo.key), amt = v || 0;
      run += amt;
      var after = Math.max(0, goal - run);
      var r = pace > 0 ? amt / pace : 0;

      document.getElementById("bar-"+mo.key).style.width = (animate ? Math.min(1,r)*100 : 0) + "%";
      document.getElementById("mb-"+mo.key).classList.toggle("is-empty", v === null);

      var tag = document.getElementById("tag-"+mo.key);
      if (v !== null && r > 1.0001){ tag.textContent = "+" + man(amt - pace); tag.hidden = false; }
      else tag.hidden = true;

      var f1 = document.getElementById("f1-"+mo.key), f2 = document.getElementById("f2-"+mo.key);
      if (v === null){ f1.textContent = "아직 입력 전"; f2.textContent = ""; }
      else {
        f1.innerHTML = "기준 " + man(pace) + "의 <b>" + Math.round(r*100) + "%</b>";
        f2.innerHTML = after === 0 ? "<b>완료</b>" : "남은 <b>" + man(after) + "</b>";
      }
    });

    var last = list[list.length-1];
    document.getElementById("periodText").textContent =
      p.y + "." + (p.m<10?"0":"") + p.m + " → " + last.y + "." + (last.m<10?"0":"") + last.m + " · " + p.n + "개월";
    document.getElementById("footPace").textContent = man(pace);
  }

  /* ── rebuild = period or plan changed ────────────────── */
  function rebuild(){
    var p = plan();
    goalInput.value = fmt(p.goal); sizeGoal();
    nameInput.value = p.name;      sizeName();
    renderPills();
    buildMonths();
    render(false);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ render(true); }); });
  }

  /* ── headline inputs ─────────────────────────────────── */
  goalInput.addEventListener("input", function(){
    var n = parseFloat(goalInput.value.replace(/,/g,""));
    sizeGoal();
    if (isFinite(n) && n > 0){ plan().goal = n * MAN; save(); render(true); }
  });
  goalInput.addEventListener("blur", function(){ goalInput.value = fmt(plan().goal); sizeGoal(); });

  nameInput.addEventListener("input", function(){
    sizeName();
    plan().name = nameInput.value; save(); renderPills();
  });
  nameInput.addEventListener("blur", function(){
    var p = plan();
    if (!p.name.trim()){ p.name = "새 플랜"; nameInput.value = p.name; sizeName(); save(); renderPills(); }
  });

  /* ── settings sheet ──────────────────────────────────── */
  var setYear = document.getElementById("setYear");
  var setMonth = document.getElementById("setMonth");
  var setLen = document.getElementById("setLen");
  for (var mm = 1; mm <= 12; mm++){
    var opt = document.createElement("option");
    opt.value = mm; opt.textContent = mm;
    setMonth.appendChild(opt);
  }

  function openSheet(){
    var p = plan();
    setYear.value = p.y; setMonth.value = p.m; setLen.value = p.n;
    scrim.setAttribute("data-open","1");
    scrim.querySelector(".sheet").focus();
  }
  function closeSheet(){ scrim.setAttribute("data-open","0"); }

  /* 컨트롤은 각자 자기 값만 반영한다. 세 개를 한꺼번에 읽으면, 하나라도 플랜과
     어긋나 있을 때 나머지 둘까지 그 값으로 덮어써 버린다. */
  function afterPeriodChange(){
    save(); resetHero(); buildMonths(); render(false);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ render(true); }); });
  }
  function applyField(el, lo, hi, prop){
    var v = parseInt(el.value, 10);
    if (!isFinite(v) || v < lo || v > hi) return;
    var p = plan();
    if (p[prop] === v) return;
    p[prop] = v;
    afterPeriodChange();
  }
  setYear.addEventListener("change", function(){ applyField(setYear, 2000, 2100, "y"); });
  setMonth.addEventListener("change", function(){ applyField(setMonth, 1, 12, "m"); });
  setLen.addEventListener("change", function(){ applyField(setLen, 1, MAXLEN, "n"); });
  setLen.addEventListener("input", function(){ applyField(setLen, 1, MAXLEN, "n"); });
  setYear.addEventListener("blur", function(){ setYear.value = plan().y; });

  document.getElementById("periodBtn").addEventListener("click", openSheet);
  document.getElementById("closeSheetBtn").addEventListener("click", closeSheet);
  scrim.addEventListener("click", function(e){ if (e.target === scrim) closeSheet(); });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && scrim.getAttribute("data-open") === "1") closeSheet();
  });

  document.getElementById("delPlanBtn").addEventListener("click", function(){
    deletePlan(vault.activeId);
  });

  document.getElementById("resetBtn").addEventListener("click", function(){
    var p = plan();
    if (!confirm("이 플랜에 적어둔 금액을 모두 지울까요?")) return;
    p.saved = {}; save(); resetHero(); buildMonths(); render(false);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ render(true); }); });
  });

  /* ── go ──────────────────────────────────────────────── */
  rebuild();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ sizeGoal(); sizeName(); });
})();
</script>
</body>
</html>
